<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Médico en Red</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-xs">
        <h1 class="text-xl font-black text-emerald-600"><i class="fa-solid fa-user-doctor"></i> Guardia Médica Activa</h1>
        <a href="/" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-2 rounded-xl">Cerrar Sesión</a>
    </header>

    <main class="p-6 max-w-5xl w-full mx-auto grid grid-cols-1 md:grid-cols-3 gap-6 flex-grow">
        <div class="md:col-span-1 bg-white p-5 rounded-3xl border shadow-sm space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400"><i class="fa-solid fa-hospital-user text-emerald-500"></i> Sala de Espera Virtual</h2>
            <div id="lista-espera" class="space-y-2">
                </div>
        </div>

        <div class="md:col-span-2 bg-white p-6 rounded-3xl border shadow-sm space-y-4 hidden" id="box-atencion">
            <h2 class="text-sm font-black text-slate-800 border-b pb-2" id="lbl-nombre-atendido">Atendiendo a: </h2>
            
            <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-xs text-amber-900">
                <span class="font-bold uppercase block text-[10px] text-amber-600 mb-1">Síntomas Declarados por el Paciente:</span>
                <p id="lbl-sintomas" class="italic">"..."</p>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-500 block">Indique Diagnóstico Crítico y Tratamiento Farmacológico:</label>
                <textarea id="recipeText" placeholder="Prescriba aquí el tratamiento detallado con dosis y duración..." 
                          class="w-full p-3 bg-slate-50 border rounded-2xl text-xs h-36 focus:outline-none focus:border-emerald-500"></textarea>
            </div>

            <button onclick="enviarAtencion()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-2xl font-bold text-xs uppercase tracking-wide transition">
                Archivar Consulta en Historial NoSQL y Notificar
            </button>
        </div>
    </main>

    <script>
        let idSeleccionado = null;

        async function cargarPacientes() {
            const res = await fetch('/api/admin/pacientes');
            const pacientes = await res.json();
            const cont = document.getElementById('lista-espera');
            cont.innerHTML = "";

            const esperando = pacientes.filter(p => p.statusConsulta === 'Esperando');

            if(esperando.length === 0) {
                cont.innerHTML = `<p class="text-xs text-slate-400 italic text-center py-4">No hay pacientes en espera en este momento.</p>`;
                document.getElementById('box-atencion').classList.add('hidden');
            } else {
                esperando.forEach(p => {
                    cont.innerHTML += `
                        <button onclick="seleccionarPaciente('${p._id}', '${p.nombre}', '${p.sintomasActuales}')" class="w-full text-left p-3 rounded-2xl border bg-slate-50 hover:bg-emerald-50/50 hover:border-emerald-300 transition block">
                            <strong class="text-xs text-slate-700 block">${p.nombre}</strong>
                            <span class="text-[10px] text-slate-400 block truncate mt-1">${p.sintomasActuales}</span>
                        </button>`;
                });
            }
        }

        function seleccionarPaciente(id, nombre, sintomas) {
            idSeleccionado = id;
            document.getElementById('box-atencion').classList.remove('hidden');
            document.getElementById('lbl-nombre-atendido').innerText = `Atendiendo a: ${nombre}`;
            document.getElementById('lbl-sintomas').innerText = `"${sintomas}"`;
        }

        async function enviarAtencion() {
            const recipeText = document.getElementById('recipeText').value.trim();
            if(!recipeText) return Swal.fire('Error', 'Debe redactar una respuesta médica.', 'warning');

            const res = await fetch('/api/medicos/atender', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idPaciente: idSeleccionado, recipeText })
            });
            const d = await res.json();
            if(d.success) {
                Swal.fire('Atendido', 'El caso fue cerrado y enviado con éxito.', 'success').then(() => {
                    document.getElementById('recipeText').value = "";
                    cargarPacientes();
                });
            }
        }

        cargarPacientes();
    </script>
</body>
</html>
