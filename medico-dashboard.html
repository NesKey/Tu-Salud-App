<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultorio Clínico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-xs">
        <h1 class="text-xl font-extrabold text-emerald-600"><i class="fa-solid fa-user-doctor"></i> Guardia en Curso</h1>
        <a href="/" class="text-xs font-bold text-slate-500 bg-slate-100 px-4 py-2 rounded-xl">Salir</a>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-4 py-8 w-full space-y-6">
        <!-- COLA DE TRIAJE -->
        <div class="bg-white p-6 rounded-2xl border shadow-xs">
            <h2 class="text-sm font-extrabold text-slate-800 mb-4 flex items-center gap-2"><i class="fa-solid fa-users text-amber-500"></i> Pacientes Esperando Diagnóstico</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left border">
                    <thead class="bg-slate-50 font-bold text-slate-600 border-b">
                        <tr>
                            <th class="p-3">Paciente</th>
                            <th class="p-3">Triaje / Base</th>
                            <th class="p-3 text-center">Tiempo en Espera</th>
                            <th class="p-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-atencion"></tbody>
                </table>
            </div>
        </div>

        <!-- FORMULARIO DE RECEPTURA -->
        <div id="box-atender" class="hidden bg-white p-6 rounded-2xl border-2 border-emerald-500 shadow-sm space-y-4 animate-fade-in">
            <h3 class="text-sm font-extrabold text-emerald-600" id="txt-atendiendo-a"></h3>
            <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
                <span class="block text-[10px] font-bold text-amber-800 uppercase mb-0.5">Síntomas Reportados:</span>
                <p id="txt-sintomas-reportados" class="text-xs text-slate-700 font-semibold italic"></p>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Tratamiento e Indicaciones Médicas (Fórmula Electrónica)</label>
                <textarea id="recipeText" rows="4" class="w-full text-sm bg-slate-50 border rounded-xl p-3 focus:outline-none focus:border-emerald-500 font-mono" placeholder="Ej. Administrar analgésicos según horario..."></textarea>
            </div>
            <button onclick="enviarAtencion()" id="btn-cerrar" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl transition text-sm">Cerrar Caso Clínico</button>
        </div>
    </main>

    <script>
        let pacienteSeleccionadoId = "";
        let listaPacientes = [];

        async function cargarPacientes() {
            const res = await fetch('/api/admin/pacientes'); 
            listaPacientes = await res.json();
            renderizarTabla();
        }

        // MEJORA 2: Función que recalcula dinámicamente los temporizadores de triaje (FIFO)
        function renderizarTabla() {
            const tbody = document.getElementById('tabla-atencion'); 
            tbody.innerHTML = '';
            const esperando = listaPacientes.filter(p => p.statusConsulta === "Esperando");

            if(esperando.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center p-6 text-slate-400">Sin emergencias en cola.</td></tr>';
                return;
            }

            esperando.forEach(p => {
                const esDeRiesgo = p.enfermedad !== "Ninguna";
                const row = document.createElement('tr');
                row.className = esDeRiesgo ? "border-b bg-amber-50/30" : "border-b";
                
                // Cálculo de tiempo transcurrido
                const transcurrido = Math.floor((new Date() - new Date(p.fechaSolicitud)) / 1000);
                const min = Math.floor(transcurrido / 60);
                const seg = transcurrido % 60;
                const tiempoTexto = `${min}m ${seg}s`;

                row.innerHTML = `
                    <td class="p-3 font-bold text-slate-700">${p.nombre}</td>
                    <td class="p-3 text-xs text-slate-500">${p.enfermedad}</td>
                    <td class="p-3 text-center font-mono text-xs font-bold ${min >= 5 ? 'text-red-500 animate-pulse' : 'text-slate-600'}">${tiempoTexto}</td>
                    <td class="p-3 text-center">
                        <button onclick="abrirConsulta('${p._id}', '${p.nombre}', '${p.sintomasActuales}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1 rounded-lg transition">Atender</button>
                    </td>`;
                tbody.appendChild(row);
            });
        }

        function abrirConsulta(id, nombre, sintomas) {
            pacienteSeleccionadoId = id;
            document.getElementById('box-atender').classList.remove('hidden');
            document.getElementById('txt-atendiendo-a').innerText = `Consulta: ${nombre}`;
            document.getElementById('txt-sintomas-reportados').innerText = `"${sintomas}"`;
        }

        async function enviarAtencion() {
            const recipeText = document.getElementById('recipeText').value.trim();
            if(!recipeText) return Swal.fire('Error', 'Indique tratamiento.', 'warning');

            const res = await fetch('/api/medicos/atender', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idPaciente: pacienteSeleccionadoId, recipeText })
            });
            if((await res.json()).success) {
                Swal.fire('Caso Guardado', 'El registro se archivó en el historial NoSQL.', 'success').then(() => {
                    document.getElementById('box-atender').classList.add('hidden');
                    document.getElementById('recipeText').value = "";
                    cargarPacientes();
                });
            }
        }

        // Bucle de refresco automático cada 1 segundo para mantener los cronómetros dinámicos activos
        setInterval(() => {
            if(listaPacientes.length > 0) renderizarTabla();
        }, 1000);

        cargarPacientes();
    </script>
</body>
</html>
