<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Salud - Panel de Pacientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-xs">
        <h1 id="saludo-bienvenida" class="text-xl font-black text-blue-600">¡Cargando portal...! 👋</h1>
        <div class="flex items-center gap-4">
            <div class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-xl border border-blue-200 text-xs font-bold">
                <i class="fa-solid fa-star text-amber-500 mr-1"></i> Estrellas: <span id="lbl-estrellas">0</span>
            </div>
            <a href="/" class="text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition">Salir</a>
        </div>
    </header>

    <main class="p-6 max-w-4xl w-full mx-auto space-y-6 flex-grow">
        <div class="bg-white p-5 rounded-3xl border shadow-xs">
            <h2 class="text-xs font-bold uppercase text-slate-400 tracking-wider mb-3"><i class="fa-solid fa-bell mr-1"></i> Alertas de Actividad Familiar</h2>
            <div id="contenedor-notificaciones" class="space-y-2">
                <p class="text-xs text-slate-400 italic">No hay alertas recientes en este momento.</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl border shadow-sm space-y-4">
            <h2 class="text-sm font-black text-slate-800"><i class="fa-solid fa-notes-medical text-blue-500 mr-1"></i> Solicitar una Consulta de Guardia</h2>
            <div class="space-y-3">
                <label class="text-xs font-bold text-slate-500 block">Describe detalladamente tus síntomas actuales:</label>
                <textarea id="txt-sintomas" placeholder="Ej: Presento fuerte dolor de cabeza, fiebre de 38.5°C y malestar general desde anoche..." 
                          class="w-full p-3 bg-slate-50 border rounded-2xl text-xs h-24 focus:outline-none focus:border-blue-500"></textarea>
                <button onclick="solicitarConsulta()" id="btn-solicitar" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-2xl font-bold text-xs uppercase tracking-wider transition">
                    Enviar al Médico de Guardia
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl border shadow-sm">
            <h2 class="text-sm font-black text-slate-800 mb-4"><i class="fa-solid fa-clock-history text-slate-400 mr-1"></i> Tu Historial Clínico y Respuestas</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-600">
                    <thead>
                        <tr class="bg-slate-50 border-b text-slate-400 font-bold uppercase">
                            <th class="p-3">Fecha</th>
                            <th class="p-3">Tus Síntomas</th>
                            <th class="p-3">Diagnóstico / Récipe</th>
                            <th class="p-3">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-historial">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idPaciente = urlParams.get('id');
        let cachePaciente = null;

        async function cargarDashboard() {
            if (!idPaciente) return;
            
            // 1. Obtener Datos del Paciente
            const resPac = await fetch(`/api/pacientes/datos/${idPaciente}`);
            cachePaciente = await resPac.json();
            
            if (cachePaciente) {
                document.getElementById('saludo-bienvenida').innerText = `¡Bienvenido, ${cachePaciente.nombre}! 👋`;
                document.getElementById('lbl-estrellas').innerText = cachePaciente.estrellas;

                // Pintar notificaciones
                if (cachePaciente.notificaciones && cachePaciente.notificaciones.length > 0) {
                    const cont = document.getElementById('contenedor-notificaciones');
                    cont.innerHTML = "";
                    cachePaciente.notificaciones.reverse().forEach(n => {
                        cont.innerHTML += `<div class="p-2.5 bg-blue-50 border border-blue-100 text-blue-800 text-xs rounded-xl font-medium flex items-center gap-2"><i class="fa-solid fa-info-circle"></i> ${n}</div>`;
                    });
                }
            }

            // 2. Obtener Historial de Tratamientos
            const resHist = await fetch(`/api/pacientes/historial/${idPaciente}`);
            const historial = await resHist.json();
            const tbody = document.getElementById('tabla-historial');
            tbody.innerHTML = "";

            if (historial.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center p-4 text-slate-400 italic">No tienes consultas registradas aún.</td></tr>`;
            } else {
                historial.forEach(h => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-slate-50/50">
                            <td class="p-3 whitespace-nowrap text-slate-400">${new Date(h.fecha).toLocaleDateString()}</td>
                            <td class="p-3 max-w-xs truncate">${h.sintomasReportados}</td>
                            <td class="p-3 font-medium text-slate-700">${h.diagnosticoTratamiento}</td>
                            <td class="p-3">
                                <button onclick="descargarPDF('${btoa(JSON.stringify(h))}')" class="bg-slate-100 hover:bg-blue-50 text-blue-600 p-1.5 rounded-lg border text-[11px] font-bold transition flex items-center gap-1">
                                    <i class="fa-solid fa-file-pdf"></i> PDF
                                </button>
                            </td>
                        </tr>`;
                });
            }
        }

        async function solicitarConsulta() {
            const sintomas = document.getElementById('txt-sintomas').value.trim();
            if (!sintomas) return Swal.fire('Error', 'Describe qué sientes por favor.', 'warning');

            const res = await fetch('/api/pacientes/solicitar-consulta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idPaciente, sintomas })
            });
            const data = await res.json();

            if (data.redirigirAPago) {
                Swal.fire({
                    title: 'Sin estrellas',
                    text: 'No te quedan estrellas para consultas. Vamos a la página de pago móvil.',
                    icon: 'error'
                }).then(() => window.location.href = `/pago.html?idPaciente=${idPaciente}`);
            } else if (data.success) {
                Swal.fire('¡Enviado!', 'Tu consulta fue asignada al médico de guardia.', 'success').then(() => window.location.reload());
            }
        }

        function descargarPDF(base64) {
            const consulta = JSON.parse(atob(base64));
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("helvetica", "bold");
            doc.text("REPORTE CLÍNICO DIGITAL", 14, 20);
            doc.setFont("helvetica", "normal");
            doc.text(`Paciente: ${cachePaciente.nombre}`, 14, 30);
            doc.text(`Cédula: ${cachePaciente.cedula}`, 14, 40);
            doc.text(`Fecha: ${new Date(consulta.fecha).toLocaleString()}`, 14, 50);
            doc.text("----------------------------------------------------------------", 14, 60);
            doc.setFont("helvetica", "bold");
            doc.text("Síntomas Reportados:", 14, 70);
            doc.setFont("helvetica", "normal");
            doc.text(consulta.sintomasReportados, 14, 80);
            doc.setFont("helvetica", "bold");
            doc.text("Tratamiento / Diagnóstico Médico:", 14, 100);
            doc.setFont("helvetica", "normal");
            doc.text(consulta.diagnosticoTratamiento, 14, 110);
            doc.save("Recipe_Digital.pdf");
        }

        cargarDashboard();
    </script>
</body>
</html>
