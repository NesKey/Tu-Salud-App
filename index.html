<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro - Mi Salud Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .form-panel { display: none; }
        .active-panel { display: block !important; }
        .sub-tab { display: none; }
        .active-tab { display: block !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full text-center">
        <h1 class="text-3xl font-black text-slate-800 mb-2">Mi Salud Digital</h1>
        <p class="text-slate-400 text-sm mb-10">Selecciona tu perfil de acceso del ecosistema clínico</p>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 max-w-3xl mx-auto">
            <button onclick="cambiarPerfil('paciente')" class="bg-white border p-4 rounded-2xl shadow-xs font-bold text-xs text-blue-600 hover:border-blue-500 transition uppercase"><i class="fa-solid fa-user-injured text-lg block mb-1"></i> Paciente</button>
            <button onclick="cambiarPerfil('medico')" class="bg-white border p-4 rounded-2xl shadow-xs font-bold text-xs text-emerald-600 hover:border-emerald-500 transition uppercase"><i class="fa-solid fa-user-doctor text-lg block mb-1"></i> Médico</button>
            <button onclick="cambiarPerfil('familiar')" class="bg-white border p-4 rounded-2xl shadow-xs font-bold text-xs text-purple-600 hover:border-purple-500 transition uppercase"><i class="fa-solid fa-users text-lg block mb-1"></i> Familiar</button>
            <button onclick="cambiarPerfil('admin')" class="bg-white border p-4 rounded-2xl shadow-xs font-bold text-xs text-amber-600 hover:border-amber-500 transition uppercase"><i class="fa-solid fa-crown text-lg block mb-1"></i> Administrador</button>
        </div>

        <div id="panel-paciente" class="form-panel active-panel max-w-md mx-auto bg-white p-6 rounded-3xl border shadow-sm">
            <div class="flex border-b mb-4">
                <button onclick="cambiarTabPaciente('login')" class="w-1/2 pb-2 text-xs font-bold uppercase tracking-wider border-b-2 border-blue-500 text-blue-600">Ingresar</button>
                <button onclick="cambiarTabPaciente('registro')" class="w-1/2 pb-2 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400">Registrarse</button>
            </div>
            
            <form id="form-paciente-login" class="sub-tab active-tab space-y-4">
                <input type="email" id="pac-login-correo" placeholder="Correo Electrónico" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="password" id="pac-login-pass" placeholder="Contraseña" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-xl text-xs font-bold uppercase tracking-wide">Iniciar Sesión</button>
            </form>

            <form id="form-paciente-registro" class="sub-tab space-y-4">
                <input type="text" id="pac-reg-nombre" placeholder="Nombre Completo" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="text" id="pac-reg-cedula" placeholder="Cédula de Identidad" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="email" id="pac-reg-correo" placeholder="Correo Electrónico" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="password" id="pac-reg-pass" placeholder="Contraseña" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="text" id="pac-reg-tlf" placeholder="Teléfono Móvil" class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="text" id="pac-reg-dir" placeholder="Dirección de Domicilio" class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-xl text-xs font-bold uppercase tracking-wide">Crear Cuenta</button>
            </form>
        </div>

        <div id="panel-medico" class="form-panel max-w-md mx-auto bg-white p-6 rounded-3xl border shadow-sm">
            <div class="flex border-b mb-4">
                <button onclick="cambiarTabMedico('login')" class="w-1/2 pb-2 text-xs font-bold uppercase tracking-wider border-b-2 border-emerald-500 text-emerald-600">Ingresar</button>
                <button onclick="cambiarTabMedico('registro')" class="w-1/2 pb-2 text-xs font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400">Postularse</button>
            </div>

            <form id="form-medico-login" class="sub-tab active-tab space-y-4">
                <input type="email" id="med-login-correo" placeholder="Correo Médico Institucional" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="password" id="med-login-pass" placeholder="Contraseña" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <button type="submit" class="w-full bg-emerald-600 text-white p-3 rounded-xl text-xs font-bold uppercase tracking-wide">Entrar al Consultorio</button>
            </form>

            <form id="form-medico-registro" class="sub-tab space-y-4">
                <input type="text" id="med-reg-nombre" placeholder="Nombre y Apellido" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="email" id="med-reg-correo" placeholder="Correo de Contacto" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="password" id="med-reg-pass" placeholder="Contraseña de Acceso" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="text" id="med-reg-esp" placeholder="Especialidad Médica (Ej: Radiólogo, Pediatra)" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <button type="submit" class="w-full bg-emerald-600 text-white p-3 rounded-xl text-xs font-bold uppercase tracking-wide">Enviar Solicitud</button>
            </form>
        </div>

        <div id="panel-familiar" class="form-panel max-w-md mx-auto bg-white p-6 rounded-3xl border shadow-sm space-y-4">
            <h2 class="text-sm font-bold text-purple-700 uppercase tracking-wide">Seguimiento Clínico Familiar</h2>
            <p class="text-slate-400 text-[11px]">Ingresa la cédula del paciente registrado que deseas monitorear en tiempo real.</p>
            <form id="form-familiar-acceso" class="space-y-4">
                <input type="text" id="fam-pac-cedula" placeholder="Cédula del Paciente" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <input type="text" id="fam-nombre" placeholder="Tu Nombre (Parentesco)" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <button type="submit" class="w-full bg-purple-600 text-white p-3 rounded-xl text-xs font-bold uppercase tracking-wide">Vincular Pantalla</button>
            </form>
        </div>

        <div id="panel-admin" class="form-panel max-w-md mx-auto bg-white p-6 rounded-3xl border shadow-sm space-y-4">
            <h2 class="text-sm font-bold text-amber-600 uppercase tracking-wide">Llave Maestra de Seguridad</h2>
            <form id="form-admin-login" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Contraseña de Administrador" required class="w-full p-3 border rounded-xl text-xs bg-slate-50">
                <button type="submit" class="w-full bg-amber-500 text-white p-3 rounded-xl text-xs font-bold uppercase tracking-wide">Acceder al Control Central</button>
            </form>
        </div>
    </div>

    <script>
        // Funciones de navegación visual del frontend
        function cambiarPerfil(perfil) {
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active-panel'));
            document.getElementById(`panel-${perfil}`).classList.add('active-panel');
        }
        function cambiarTabPaciente(tab) {
            document.querySelectorAll('#panel-paciente .sub-tab').forEach(t => t.classList.remove('active-tab'));
            if(tab==='login') document.getElementById('form-paciente-login').classList.add('active-tab');
            else document.getElementById('form-paciente-registro').classList.add('active-tab');
        }
        function cambiarTabMedico(tab) {
            document.querySelectorAll('#panel-medico .sub-tab').forEach(t => t.classList.remove('active-tab'));
            if(tab==='login') document.getElementById('form-medico-login').classList.add('active-tab');
            else document.getElementById('form-medico-registro').classList.add('active-tab');
        }

        // 1. PACIENTES: REGISTRO
        document.getElementById('form-paciente-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/pacientes/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: document.getElementById('pac-reg-nombre').value,
                    cedula: document.getElementById('pac-reg-cedula').value,
                    correo: document.getElementById('pac-reg-correo').value,
                    contrasena: document.getElementById('pac-reg-pass').value,
                    telefonoMovil: document.getElementById('pac-reg-tlf').value,
                    direccion: document.getElementById('pac-reg-dir').value
                })
            });
            const data = await response.json();
            if(data.success) {
                Swal.fire('¡Registro Exitoso!', 'Ya posees 1 estrella de bienvenida.', 'success').then(() => {
                    window.location.href = `/paciente-dashboard.html?idPaciente=${data.idPaciente}`;
                });
            } else {
                Swal.fire('Error', 'Este correo ya se encuentra registrado.', 'error');
            }
        });

        // 2. PACIENTES: LOGIN (REPARADO CON ID EN LA URL)
        document.getElementById('form-paciente-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/pacientes/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correo: document.getElementById('pac-login-correo').value,
                    contrasena: document.getElementById('pac-login-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                // SE AGREGA EL PARÁMETRO EN LA URL PARA EVITAR ERRORES DE EXPEDIENTE VACÍO
                window.location.href = `/paciente-dashboard.html?idPaciente=${data.idPaciente}`;
            } else {
                Swal.fire('Error', 'Usuario o contraseña incorrectos.', 'error');
            }
        });

        // 3. MÉDICOS: REGISTRO
        document.getElementById('form-medico-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/medicos/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: document.getElementById('med-reg-nombre').value,
                    correo: document.getElementById('med-reg-correo').value,
                    contrasena: document.getElementById('med-reg-pass').value,
                    especialidad: document.getElementById('med-reg-esp').value
                })
            });
            if((await response.json()).success) {
                Swal.fire('Postulación Enviada', 'Tu solicitud está en revisión por parte de administración.', 'info').then(() => window.location.reload());
            }
        });

        // 4. MÉDICOS: LOGIN
        document.getElementById('form-medico-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/medicos/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correo: document.getElementById('med-login-correo').value,
                    contrasena: document.getElementById('med-login-pass').value
                })
            });
            
            if (response.status === 403) {
                return Swal.fire('Acceso Restringido', 'Tu cuenta médica aún no ha sido aprobada por administración.', 'warning');
            }
            
            const data = await response.json();
            if(data.success) {
                window.location.href = '/medico-dashboard.html';
            } else {
                Swal.fire('Error', 'Credenciales médicas inválidas.', 'error');
            }
        });

        // 5. FAMILIARES: ACCESO DE VINCULACIÓN
        document.getElementById('form-familiar-acceso').addEventListener('submit', async (e) => {
            e.preventDefault();
            const cedulaBusqueda = document.getElementById('fam-pac-cedula').value.trim();
            const familiar = document.getElementById('fam-nombre').value.trim();

            const res = await fetch('/api/admin/pacientes');
            const pacientes = await res.json();
            const encontrado = pacientes.find(p => p.cedula === cedulaBusqueda);

            if(encontrado) {
                window.location.href = `/familiar-dashboard.html?idPaciente=${encontrado._id}&familiar=${encodeURIComponent(familiar)}`;
            } else {
                Swal.fire('No encontrado', 'No hay ningún expediente con esa cédula de identidad.', 'error');
            }
        });

        // 6. ADMINISTRADOR: LOGIN
        document.getElementById('form-admin-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password: document.getElementById('admin-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                window.location.href = '/admin.html';
            } else {
                Swal.fire('Acceso Maestro Fallido', 'Contraseña incorrecta.', 'error');
            }
        });
    </script>
</body>
</html>
