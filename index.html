<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Seguro - Mi Salud Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .form-panel { display: none; }
        .active-panel { display: block !important; }
        .sub-tab { display: none; }
        .active-tab { display: block !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-4xl w-full text-center">
        <h1 class="text-3xl font-black text-slate-800 mb-2">Mi Salud Digital</h1>
        <p class="text-slate-400 text-sm mb-10">Selecciona tu perfil de acceso del ecosistema clínico</p>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 max-w-3xl mx-auto">
            <button onclick="activarRol('paciente')" class="p-5 bg-white rounded-2xl border hover:border-blue-500 transition shadow-xs text-center">
                <i class="fa-solid fa-user-injured text-3xl text-blue-500 mb-2"></i>
                <p class="text-xs font-bold text-slate-700">Paciente</p>
            </button>
            <button onclick="activarRol('familiar')" class="p-5 bg-white rounded-2xl border hover:border-purple-500 transition shadow-xs text-center">
                <i class="fa-solid fa-people-roof text-3xl text-purple-500 mb-2"></i>
                <p class="text-xs font-bold text-slate-700">Familiar</p>
            </button>
            <button onclick="activarRol('medico')" class="p-5 bg-white rounded-2xl border hover:border-emerald-500 transition shadow-xs text-center">
                <i class="fa-solid fa-user-doctor text-3xl text-emerald-500 mb-2"></i>
                <p class="text-xs font-bold text-slate-700">Médico</p>
            </button>
            <button onclick="activarRol('admin')" class="p-5 bg-white rounded-2xl border hover:border-amber-500 transition shadow-xs text-center">
                <i class="fa-solid fa-crown text-3xl text-amber-500 mb-2"></i>
                <p class="text-xs font-bold text-slate-700">Admin</p>
            </button>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 max-w-md w-full mx-auto text-left min-h-[200px]">
            <p id="txt-vacio" class="text-center text-slate-400 text-sm py-10">Elige un rol superior para desplegar el formulario.</p>

            <div id="panel-paciente" class="form-panel">
                <div class="flex border-b mb-4">
                    <button id="btn-tab-paciente-login" onclick="cambiarPestana('paciente', 'login')" class="w-1/2 pb-2 text-xs font-bold text-center border-b-2 border-blue-500 text-blue-600">Iniciar Sesión</button>
                    <button id="btn-tab-paciente-registro" onclick="cambiarPestana('paciente', 'registro')" class="w-1/2 pb-2 text-xs font-bold text-center text-slate-400">Registrarse</button>
                </div>
                <div id="paciente-login" class="sub-tab active-tab">
                    <form id="form-paciente-login" class="space-y-3">
                        <input type="email" id="pac-login-correo" required placeholder="Correo electrónico" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                        <input type="password" id="pac-login-pass" required placeholder="Contraseña" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                        <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold text-xs uppercase">Entrar</button>
                    </form>
                </div>
                <div id="paciente-registro" class="sub-tab">
                    <form id="form-paciente-registro" class="space-y-2">
                        <input type="text" id="pac-reg-nombre" required placeholder="Nombre Completo" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="pac-reg-cedula" required placeholder="Cédula de Identidad" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="pac-reg-telefono" required placeholder="Teléfono Móvil" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="pac-reg-fijo" placeholder="Teléfono Fijo" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="email" id="pac-reg-correo" required placeholder="Correo Electrónico" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="pac-reg-dir" required placeholder="Dirección de Habitación" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="password" id="pac-reg-pass" required placeholder="Contraseña" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="password" id="pac-reg-confpass" required placeholder="Confirmar Contraseña" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-lg font-bold text-xs uppercase">Crear Cuenta</button>
                    </form>
                </div>
            </div>

            <div id="panel-familiar" class="form-panel">
                <div class="flex border-b mb-4">
                    <button id="btn-tab-familiar-login" onclick="cambiarPestana('familiar', 'login')" class="w-1/2 pb-2 text-xs font-bold text-center border-b-2 border-purple-500 text-purple-600">Ingresar</button>
                    <button id="btn-tab-familiar-registro" onclick="cambiarPestana('familiar', 'registro')" class="w-1/2 pb-2 text-xs font-bold text-center text-slate-400">Vincular Nuevo</button>
                </div>
                <div id="familiar-login" class="sub-tab active-tab">
                    <form id="form-familiar-login" class="space-y-3">
                        <input type="email" id="fam-login-correo" required placeholder="Correo de familiar" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                        <input type="password" id="fam-login-pass" required placeholder="Contraseña" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                        <button type="submit" class="w-full bg-purple-600 text-white p-2.5 rounded-xl font-bold text-xs uppercase">Acceder al Monitor</button>
                    </form>
                </div>
                <div id="familiar-registro" class="sub-tab">
                    <form id="form-familiar-registro" class="space-y-2">
                        <input type="text" id="fam-reg-nombre" required placeholder="Su Nombre Completo" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="fam-reg-tel" required placeholder="Su Teléfono" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="email" id="fam-reg-correo" required placeholder="Su Correo Electrónico" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="fam-reg-pacnombre" required placeholder="Nombre del Paciente a Monitorear" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="fam-reg-vinculo" required placeholder="Vínculo Familiar (Ej: Tío, Madre)" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="email" id="fam-reg-paccorreo" required placeholder="Correo exacto del Paciente" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="password" id="fam-reg-pass" required placeholder="Asigne una Contraseña" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <button type="submit" class="w-full bg-purple-500 text-white p-2 rounded-lg font-bold text-xs uppercase">Establecer Enlace</button>
                    </form>
                </div>
            </div>

            <div id="panel-medico" class="form-panel">
                <div class="flex border-b mb-4">
                    <button id="btn-tab-medico-login" onclick="cambiarPestana('medico', 'login')" class="w-1/2 pb-2 text-xs font-bold text-center border-b-2 border-emerald-500 text-emerald-600">Entrar</button>
                    <button id="btn-tab-medico-registro" onclick="cambiarPestana('medico', 'registro')" class="w-1/2 pb-2 text-xs font-bold text-center text-slate-400">Postularse</button>
                </div>
                <div id="medico-login" class="sub-tab active-tab">
                    <form id="form-medico-login" class="space-y-3">
                        <input type="email" id="med-login-correo" required placeholder="Correo Institucional" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                        <input type="password" id="med-login-pass" required placeholder="Contraseña" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                        <button type="submit" class="w-full bg-emerald-600 text-white p-2.5 rounded-xl font-bold text-xs uppercase">Iniciar Guardia</button>
                    </form>
                </div>
                <div id="medico-registro" class="sub-tab">
                    <form id="form-medico-registro" class="space-y-2">
                        <input type="text" id="med-reg-nombre" required placeholder="Nombre Completo" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="med-reg-cedula" required placeholder="Cédula / Código MPPS" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="med-reg-tel" required placeholder="Teléfono de Contacto" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="email" id="med-reg-correo" required placeholder="Correo Electrónico" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="text" id="med-reg-dir" required placeholder="Dirección Médica o Consultorio" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <input type="password" id="med-reg-pass" required placeholder="Contraseña" class="w-full p-2 bg-slate-50 border rounded-lg text-xs">
                        <div class="p-2 bg-amber-50 border border-amber-200 rounded-lg text-[10px] text-amber-700">
                            <i class="fa-solid fa-paperclip mr-1"></i> Título, Cédula y Cursos serán adjuntados automáticamente para revisión del Admin.
                        </div>
                        <button type="submit" class="w-full bg-emerald-500 text-white p-2 rounded-lg font-bold text-xs uppercase">Enviar Postulación</button>
                    </form>
                </div>
            </div>

            <div id="panel-admin" class="form-panel">
                <h3 class="text-xs font-black uppercase text-amber-600 mb-3 tracking-wider">Módulo Central Administrativo</h3>
                <form id="form-admin-login" class="space-y-3">
                    <input type="password" id="admin-pass" required placeholder="Contraseña de Seguridad Master" class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs">
                    <button type="submit" class="w-full bg-amber-500 text-white p-2.5 rounded-xl font-bold text-xs uppercase">Acceder</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        function activarRol(rol) {
            document.getElementById('txt-vacio').style.display = 'none';
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active-panel'));
            document.getElementById('panel-' + rol).classList.add('active-panel');
        }

        function cambiarPestana(rol, tipo) {
            const contenedor = document.getElementById('panel-' + rol);
            contenedor.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(`${rol}-${tipo}`).classList.add('active-tab');

            const esLogin = (tipo === 'login');
            const colorClase = rol === 'paciente' ? 'blue' : (rol === 'familiar' ? 'purple' : 'emerald');
            
            const btnLogin = document.getElementById(`btn-tab-${rol}-login`);
            const btnReg = document.getElementById(`btn-tab-${rol}-registro`);

            if(esLogin) {
                if(btnLogin) btnLogin.className = `w-1/2 pb-2 text-xs font-bold text-center border-b-2 border-${colorClase}-500 text-${colorClase}-600`;
                if(btnReg) btnReg.className = "w-1/2 pb-2 text-xs font-bold text-center text-slate-400";
            } else {
                if(btnReg) btnReg.className = `w-1/2 pb-2 text-xs font-bold text-center border-b-2 border-${colorClase}-500 text-${colorClase}-600`;
                if(btnLogin) btnLogin.className = "w-1/2 pb-2 text-xs font-bold text-center text-slate-400";
            }
        }

        // 1. PACIENTE: REGISTRO
        document.getElementById('form-paciente-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const contrasena = document.getElementById('pac-reg-pass').value;
            const confirmarContrasena = document.getElementById('pac-reg-confpass').value;

            if(contrasena !== confirmarContrasena) {
                return Swal.fire('Error', 'Las contraseñas no coinciden.', 'error');
            }

            const bodyData = {
                nombre: document.getElementById('pac-reg-nombre').value,
                cedula: document.getElementById('pac-reg-cedula').value,
                telefonoMovil: document.getElementById('pac-reg-telefono').value,
                telefonoFijo: document.getElementById('pac-reg-fijo').value,
                correo: document.getElementById('pac-reg-correo').value,
                direccion: document.getElementById('pac-reg-dir').value,
                contrasena,
                confirmarContrasena
            };

            const response = await fetch('/api/pacientes/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            const data = await response.json();

            if(data.success) {
                Swal.fire('¡Felicidades!', 'Tu cuenta ha sido creada. Ingresa ahora.', 'success')
                    .then(() => cambiarPestana('paciente', 'login'));
            } else {
                Swal.fire('Error de Registro', data.error || 'No se pudo crear el expediente.', 'error');
            }
        });

        // 2. PACIENTE: LOGIN
        document.getElementById('form-paciente-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/pacientes/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correo: document.getElementById('pac-login-correo').value,
                    contrasena: document.getElementById('pac-login-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                window.location.href = `/paciente-dashboard.html?id=${data.id}`;
            } else {
                Swal.fire('Acceso Denegado', 'Credenciales inválidas.', 'error');
            }
        });

        // 3. FAMILIAR: REGISTRO
        document.getElementById('form-familiar-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/familiares/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombreFamiliar: document.getElementById('fam-reg-nombre').value,
                    telefonoFamiliar: document.getElementById('fam-reg-tel').value,
                    correoFamiliar: document.getElementById('fam-reg-correo').value,
                    nombrePacienteAVer: document.getElementById('fam-reg-pacnombre').value,
                    vinculo: document.getElementById('fam-reg-vinculo').value,
                    correoPacienteVinculado: document.getElementById('fam-reg-paccorreo').value,
                    contrasenaFamiliar: document.getElementById('fam-reg-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                Swal.fire('Enlace Listo', 'Se vinculó el monitoreo con éxito.', 'success')
                    .then(() => cambiarPestana('familiar', 'login'));
            } else {
                Swal.fire('Error', 'No se pudo establecer el enlace.', 'error');
            }
        });

        // 4. FAMILIAR: LOGIN
        document.getElementById('form-familiar-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/familiares/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correoFamiliar: document.getElementById('fam-login-correo').value,
                    contrasenaFamiliar: document.getElementById('fam-login-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                window.location.href = `/familiar-dashboard.html?idPaciente=${data.idPaciente}&familiar=${encodeURIComponent(data.familiar)}`;
            } else {
                Swal.fire('Error', 'Familiar no registrado o clave incorrecta.', 'error');
            }
        });

        // 5. MÉDICO: POSTULACIÓN
        document.getElementById('form-medico-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/medicos/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombreCompleto: document.getElementById('med-reg-nombre').value,
                    cedulaProfesional: document.getElementById('med-reg-cedula').value,
                    telefono: document.getElementById('med-reg-tel').value,
                    correo: document.getElementById('med-reg-correo').value,
                    direccion: document.getElementById('med-reg-dir').value,
                    contrasena: document.getElementById('med-reg-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                Swal.fire('Postulación Enviada', 'Espera a que el Administrador valide tus credenciales.', 'info')
                    .then(() => cambiarPestana('medico', 'login'));
            } else {
                Swal.fire('Error', 'No se pudo procesar la postulación médica.', 'error');
            }
        });

        // 6. MÉDICO: LOGIN
        document.getElementById('form-medico-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/medicos/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    correo: document.getElementById('med-login-correo').value,
                    contrasena: document.getElementById('med-login-pass').value
                })
            });
            
            if (response.status === 403) {
                return Swal.fire('Acceso Restringido', 'Tu cuenta médica aún no ha sido autorizada por el administrador.', 'warning');
            }
            
            const data = await response.json();
            if(data.success) {
                window.location.href = '/medico-dashboard.html';
            } else {
                Swal.fire('Error', 'Credenciales inválidas.', 'error');
            }
        });

        // 7. ADMINISTRADOR: LOGIN
        document.getElementById('form-admin-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const response = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    password: document.getElementById('admin-pass').value
                })
            });
            const data = await response.json();
            if(data.success) {
                window.location.href = '/admin.html';
            } else {
                Swal.fire('Acceso Maestro Fallido', 'Contraseña administrativa incorrecta.', 'error');
            }
        });
    </script>
</body>
</html>
