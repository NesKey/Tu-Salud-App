<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Familiar Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b py-4 px-6 flex justify-between items-center shadow-xs">
        <h1 class="text-lg font-black text-purple-700"><i class="fa-solid fa-house-user mr-1"></i> Portal de Acompañamiento Familiar</h1>
        <span id="txt-familiar" class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-xl">Familiar Activo</span>
    </header>

    <main class="flex-grow max-w-2xl w-full mx-auto p-6 space-y-6">
        <div class="bg-white p-6 rounded-3xl border shadow-sm space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Datos Clínicos del Paciente Vinculado</h2>
            
            <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-2xl border text-xs">
                <div>
                    <span class="text-slate-400 block">Nombre del Pariente:</span>
                    <strong id="lbl-nombre" class="text-sm text-slate-700">-</strong>
                </div>
                <div>
                    <span class="text-slate-400 block">Estatus Actual en Red:</span>
                    <span id="lbl-status" class="inline-block mt-0.5 px-2 py-0.5 rounded-md font-bold bg-slate-200 text-slate-600">Buscando...</span>
                </div>
            </div>

            <div class="space-y-2">
                <h3 class="text-xs font-bold text-slate-500"><i class="fa-solid fa-file-medical-alt text-purple-500 mr-1"></i> Último Tratamiento Registrado por el Médico:</h3>
                <div id="box-receta" class="p-4 bg-purple-50/50 border border-purple-100 rounded-2xl text-xs text-purple-900 font-medium min-h-[60px]">
                    No hay diagnósticos cargados hoy en el expediente NoSQL.
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const idPaciente = urlParams.get('idPaciente');
        const familiarNombre = urlParams.get('familiar');

        if(familiarNombre) {
            document.getElementById('txt-familiar').innerText = `Monitor: ${decodeURIComponent(familiarNombre)}`;
        }

        async function cargarExpediente() {
            if(!idPaciente) return;
            const resPac = await fetch(`/api/pacientes/datos/${idPaciente}`);
            const p = await resPac.json();

            if(p) {
                document.getElementById('lbl-nombre').innerText = p.nombre;
                
                const st = document.getElementById('lbl-status');
                st.innerText = p.statusConsulta.toUpperCase();
                if(p.statusConsulta === 'Atendido') st.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-emerald-100 text-emerald-800";
                if(p.statusConsulta === 'Esperando') st.className = "px-2 py-0.5 rounded text-[11px] font-bold bg-amber-100 text-amber-800 animate-pulse";

                // Consultar receta reciente en el historial
                const resHist = await fetch(`/api/pacientes/historial/${idPaciente}`);
                const h = await resHist.json();
                if(h && h.length > 0) {
                    document.getElementById('box-receta').innerText = h[0].diagnosticoTratamiento;
                }
            }
        }
        cargarExpediente();
    </script>
</body>
</html>
