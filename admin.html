<!-- BLOQUE DE ANALÍTICA EPIDEMIOLÓGICA -->
<div class="bg-white p-6 rounded-2xl border shadow-xs space-y-4 my-6 max-w-4xl mx-auto">
    <h2 class="text-sm font-extrabold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-blue-500"></i> Reporte Estadístico Epidemiológico (MongoDB Aggregation)</h2>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-slate-50 p-4 rounded-xl border text-center">
            <span class="text-xs font-bold text-slate-400 block uppercase">Total Fichas Creadas</span>
            <span id="stat-pacientes" class="text-2xl font-black text-slate-700">-</span>
        </div>
        <div class="bg-slate-50 p-4 rounded-xl border text-center">
            <span class="text-xs font-bold text-slate-400 block uppercase">Total Atenciones Brindadas</span>
            <span id="stat-consultas" class="text-2xl font-black text-blue-600">-</span>
        </div>
    </div>

    <div class="bg-slate-50 p-4 rounded-xl border">
        <span class="text-xs font-bold text-slate-500 block uppercase mb-2">Prevalencia de Enfermedades Crónicas en la Población:</span>
        <div id="stat-lista-enfermedades" class="text-xs space-y-1.5 text-slate-600"></div>
    </div>
</div>

<script>
    async function cargarEstadisticasEpidemiologicas() {
        const res = await fetch('/api/admin/estadisticas');
        const data = await res.json();
        
        document.getElementById('stat-pacientes').innerText = data.totalPacientes;
        document.getElementById('stat-consultas').innerText = data.totalConsultas;
        
        const lista = document.getElementById('stat-lista-enfermedades');
        lista.innerHTML = "";
        
        data.enfermedadesFrecuentes.forEach(item => {
            const porcentaje = data.totalPacientes > 0 ? Math.round((item.total / data.totalPacientes) * 100) : 0;
            const div = document.createElement('div');
            div.className = "flex justify-between items-center bg-white p-2 rounded border";
            div.innerHTML = `<strong>${item._id}</strong> <span>${item.total} Casos (${porcentaje}%)</span>`;
            lista.appendChild(div);
        });
    }
    
    // Llamar la función al cargar la vista administrativa
    cargarEstadisticasEpidemiologicas();
</script>
